
<svg xmlns="http://www.w3.org/2000/svg"
     width="720" height="280"
     viewBox="0 0 720 280">

  <title>LF Vision</title>

  <style>
    .letter-l {
      animation: enterL 8s infinite;
    }

    .letter-f {
      animation: enterF 8s infinite;
    }

    .vision {
      animation: enterVision 8s infinite;
    }

    @keyframes enterL {
      0% {
        opacity: 0;
        transform: translateX(-20px);
      }
      12%, 95% {
        opacity: 1;
        transform: translateX(0);
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes enterF {
      0%, 12% {
        opacity: 0;
        transform: translateY(-20px);
      }
      25%, 95% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes enterVision {
      0%, 25% {
        opacity: 0;
      }
      40%, 95% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .letter-l, .letter-f, .vision {
        animation: none;
      }
    }

    text {
      font-family: Inter, 'Segoe UI', Arial, sans-serif;
      direction: ltr;
    }
  </style>

  <!-- Background -->

  <rect width="720" height="280"
        fill="#FFFFFF"/>

  <!-- Animated Logo -->

  <g transform="translate(245 12) scale(0.7)">

    <path class="letter-l"
          d="M25 20H42V75H86V92H25Z"
          fill="#111111"/>

    <path class="letter-f"
          d="M54 20H111V36H71V49H102V65H71V70H54Z"
          fill="#111111"/>

    <text class="vision"
          x="128"
          y="80"
          font-size="62"
          font-weight="300"
          letter-spacing="-2"
          fill="#111111">Vision</text>

  </g>

  <!-- Main Heading -->

  <text x="360" y="132"
        text-anchor="middle"
        font-size="26"
        font-weight="500"
        letter-spacing="-0.9"
        fill="#111111">
    Engineering Better Business Systems.
  </text>

  <!-- Specialization -->

  <text x="360" y="166"
        text-anchor="middle"
        font-size="14"
        font-weight="400"
        letter-spacing="0.4"
        fill="#666666">
    Frappe · ERPNext · Business Workflows
  </text>

  <!-- Separator -->

  <line x1="60" y1="192"
        x2="660" y2="192"
        stroke="#DEDEDE"
        stroke-width="1"/>

  <!-- Description -->

  <text x="360" y="226"
        text-anchor="middle"
        font-size="15"
        font-weight="400"
        fill="#444444">
    Have a question, need advice, or facing a challenge with ERPNext?
  </text>

  <text x="360" y="257"
        text-anchor="middle"
        font-size="15"
        font-weight="400"
        fill="#444444">
    I'm open to consultations and discussions.
  </text>

</svg>
