
<svg xmlns="http://www.w3.org/2000/svg"
     width="420"
     height="120"
     viewBox="0 0 420 120">

  <style>
    .letter-l {
      animation: enterL 7s infinite;
    }

    .letter-f {
      animation: enterF 7s infinite;
    }

    .vision {
      animation: enterVision 7s infinite;
    }

    @keyframes enterL {
      0% {
        opacity: 0;
        transform: translateX(-25px);
      }
      12%, 95% {
        opacity: 1;
        transform: translateX(0);
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes enterF {
      0%, 12% {
        opacity: 0;
        transform: translateY(-25px);
      }
      25%, 95% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes enterVision {
      0%, 25% {
        opacity: 0;
        transform: translateX(-8px);
      }
      40%, 95% {
        opacity: 1;
        transform: translateX(0);
      }
      100% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .letter-l, .letter-f, .vision {
        animation: none;
      }
    }
  </style>

  <rect width="420" height="120"
        rx="8" fill="#FFFFFF"/>

  <path class="letter-l"
        d="M25 20H42V75H86V92H25Z"
        fill="#111111"/>

  <path class="letter-f"
        d="M54 20H111V36H71V49H102V65H71V70H54Z"
        fill="#111111"/>

  <text class="vision"
        x="128"
        y="80"
        font-family="Arial, Helvetica, sans-serif"
        font-size="62"
        font-weight="300"
        letter-spacing="-2"
        fill="#111111">Vision</text>

</svg>
